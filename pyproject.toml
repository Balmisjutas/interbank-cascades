[project]
name = "interbank-cascades"
version = "0.1.0"
description = "Default cascades on simulated interbank networks, and a fair test of what a GNN adds"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "scikit-learn",
    "matplotlib",
    "torch",
    "torch-geometric",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascades"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
