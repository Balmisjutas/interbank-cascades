<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interbank default cascades</title>
<style>
  :root {
    --surface: #fcfcfb; --panel: #f3f2ed; --ink: #1a1a19; --ink2: #55544e; --muted: #7a7970;
    --line: #dddcd4; --link: #b9b8ae; --bank: #c9c8c0; --bank-edge: #8f8e85;
    --trigger: #eb6834; --r1: #86b6ef; --r2: #3987e5; --r3: #1c5cab; --r4: #0d366b; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1a1a19; --panel: #242422; --ink: #ffffff; --ink2: #c3c2b7; --muted: #96958b;
      --line: #3a3a36; --link: #55544e; --bank: #4a4944; --bank-edge: #7a7970;
      --trigger: #eb6834; --r1: #2a78d6; --r2: #5598e7; --r3: #9ec5f4; --r4: #e6f0fd; --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1a1a19; --panel: #242422; --ink: #ffffff; --ink2: #c3c2b7; --muted: #96958b;
    --line: #3a3a36; --link: #55544e; --bank: #4a4944; --bank-edge: #7a7970;
    --trigger: #eb6834; --r1: #2a78d6; --r2: #5598e7; --r3: #9ec5f4; --r4: #e6f0fd; --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .foot { margin-top: 22px; font-size: 13px; color: var(--ink2); }
  p.lead { margin: 0 0 16px; color: var(--ink2); max-width: 75ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; margin-bottom: 14px; }
  .controls label { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  input[type=range] { accent-color: var(--accent); }
  .tau-value { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  .controls input[type=range] { width: 190px; }
  .formula { background: var(--panel); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 14px; color: var(--ink2); }
  .formula b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--surface); color: var(--ink2); }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 20px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .controls label, .controls input[type=range] { width: 100%; } }
  .card { background: var(--panel); border-radius: 10px; padding: 14px; }
  #net { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--surface); border-radius: 8px; padding: 10px; }
  .tile b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--ink2); }
  h2 { font-size: 14px; margin: 14px 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); margin-top: 10px; }
  #strip { width: 100%; height: 110px; display: block; }
  .note { font-size: 13px; color: var(--ink2); margin: 8px 0 0; }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px;
         padding: 6px 8px; border-radius: 6px; max-width: 240px; opacity: 0; transition: opacity .1s; z-index: 5; }
  .bank { cursor: pointer; stroke: var(--surface); stroke-width: 1.5; }
  .bank:hover, .bank:focus { stroke: var(--ink); outline: none; }
  .bar { cursor: pointer; }
  details { margin-top: 14px; font-size: 13px; color: var(--ink2); }
  table { border-collapse: collapse; font-size: 12px; margin-top: 8px; width: 100%; }
  th, td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-t="title"></h1>
    <span class="seg" role="group" aria-label="Language"><button id="l-en" lang="en">English</button><button id="l-fr" lang="fr">Français</button></span>
  </div>
  <p class="lead" data-t="lead"></p>

  <div class="controls">
    <label><span data-t="network"></span> <select id="which"></select></label>
    <label><span id="cap-label"></span>
      <input id="cap" type="range" min="5" max="75" step="1" value="30">
    </label>
    <label><span id="lgd-label"></span>
      <input id="lgd" type="range" min="10" max="100" step="5" value="60">
    </label>
    <label><span id="shock-label"></span>
      <input id="shock" type="range" min="0" max="50" step="1" value="0">
    </label>
    <label><span data-t="view"></span>
      <span class="seg"><button id="v-cascade" aria-pressed="true" data-t="viewOne"></button><button id="v-frag" aria-pressed="false" data-t="viewFragile"></button></span>
    </label>
    <button id="worst" data-t="worst"></button>
    <button id="replay" data-t="replay"></button>
  </div>

  <p class="formula" id="formula"></p>

  <div class="layout">
    <div class="card">
      <svg id="net" viewBox="0 0 700 700" role="img"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div>
      <div class="tiles">
        <div class="tile"><b id="t-size">0</b><span id="t-size-label"></span></div>
        <div class="tile"><b id="t-rounds">0</b><span id="t-rounds-label"></span></div>
        <div class="tile"><b id="t-share">0&nbsp;%</b><span data-t="tileShare"></span></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0" data-t="stripTitle"></h2>
        <svg id="strip" role="img"></svg>
        <p class="note" id="strip-note"></p>
      </div>
      <p class="note" id="reading"></p>
      <details>
        <summary data-t="aboutTitle"></summary>
        <p data-t="about1"></p>
        <p data-t="about2"></p>
      </details>
      <details>
        <summary data-t="tablesTitle"></summary>
        <div id="tables"></div>
      </details>
    </div>
  </div>
  <p class="foot"><span data-t="foot"></span> <a href="https://github.com/Balmisjutas/interbank-cascades">github.com/Balmisjutas/interbank-cascades</a></p>
</main>
<div id="tip"></div>

<script src="networks.js"></script>
<script src="cascade.js"></script>
<script src="i18n.js"></script>
<script>
// ?theme=light or ?theme=dark overrides the system setting; ?lang=en or ?lang=fr overrides the browser language
const params = new URLSearchParams(location.search);
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
let lang = ["en", "fr"].includes(params.get("lang")) ? params.get("lang") : (navigator.language || "en").startsWith("fr") ? "fr" : "en";
const t = (key, ...args) => { const v = TEXT[lang][key]; return typeof v === "function" ? v(...args) : v; };
const num = (x, digits) => x.toLocaleString(lang, { minimumFractionDigits: digits, maximumFractionDigits: digits });
const pct = (text) => text + (lang === "fr" ? "\u202f%" : " %");

const SIZE = 700, PAD = 26;
const roundColor = (r) => r === 0 ? "var(--trigger)" : r < 0 ? "var(--bank)" : `var(--r${Math.min(r, 4)})`;
const svgEl = (name, attrs) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
const $ = (id) => document.getElementById(id);
const tip = $("tip");
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const x = Math.min(evt.clientX + 14, window.innerWidth - 250);
  tip.style.left = x + "px"; tip.style.top = (evt.clientY + 14) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

let net, prep, capital, all, trigger = null, shown = 99, timer = null, view = "cascade";
// capital c (share of lending), loss rate LGD and common shock s combine into one threshold
const tauNow = () => (+$("cap").value / 100) * (1 - +$("shock").value / 100) / (+$("lgd").value / 100);
// fixed bins, so that a colour means the same thing at every setting
const FRAG_BINS = [0.02, 0.05, 0.10];
const fragColor = (f) => f <= 0 ? "var(--bank)" : `var(--r${1 + FRAG_BINS.filter((b) => f >= b).length})`;
const worstBank = () => all.sizes.indexOf(Math.max(...all.sizes));

function networkNames() {
  const keep = $("which").value || 0, count = {};
  $("which").replaceChildren();
  NETWORKS.forEach((n, i) => {
    count[n.family] = (count[n.family] || 0) + 1;
    $("which").add(new Option(t("networkName", n.family, count[n.family]), i));
  });
  $("which").value = keep;
}

function xy(i) { return [PAD + net.pos[i][0] * (SIZE - 2 * PAD), PAD + net.pos[i][1] * (SIZE - 2 * PAD)]; }

function buildNetwork() {
  const svg = $("net"); svg.replaceChildren();
  const gl = svgEl("g", { id: "links" }), gb = svgEl("g", { id: "banks" });
  net.links.forEach(([i, j], k) => {
    const [x1, y1] = xy(i), [x2, y2] = xy(j);
    gl.append(svgEl("line", { x1, y1, x2, y2, "data-k": k, stroke: "var(--link)", "stroke-width": 0.6, opacity: 0.55 }));
  });
  const maxA = Math.max(...prep.assets);
  for (let i = 0; i < net.n; i++) {
    const [cx, cy] = xy(i);
    const r = 5 + 9 * Math.sqrt(prep.assets[i] / maxA);
    const c = svgEl("circle", { class: "bank", cx, cy, r, "data-i": i, tabindex: 0, fill: "var(--bank)", "aria-label": t("bank", i + 1) });
    c.addEventListener("click", () => fail(i));
    c.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fail(i); } });
    c.addEventListener("mousemove", (e) => showTip(e, bankTip(i)));
    c.addEventListener("mouseleave", hideTip);
    gb.append(c);
  }
  svg.append(gl, gb);
}

function bankTip(i) {
  const nb = net.links.filter((l) => l[0] === i).length, nl = prep.lendersOf[i].length;
  const own = tauNow() * net.strength[i];
  const r = trigger === null || view === "frag" ? null : all.rounds[trigger][i];
  const state = r === null ? "" : r === 0 ? `<br><b>${t("tipFirst")}</b>` : r > 0 ? `<br><b>${t("tipRound", r)}</b>` : `<br>${t("tipSurvives")}`;
  return `<b>${t("bank", i + 1)}</b><br>${t("tipLinks", nb, nl)}<br>` +
    (own > 1 ? t("tipCannot") : t("tipThreshold", num(100 * own, 0))) +
    `<br>${t("tipDamage", all.sizes[i])}<br>${t("tipFragility", num(100 * all.fragility[i], 0))}${state}`;
}

function paint() {
  const frag = view === "frag";
  const rounds = trigger === null || frag ? null : all.rounds[trigger];
  document.querySelectorAll("#banks circle").forEach((c) => {
    const i = +c.dataset.i, r = rounds ? rounds[i] : -1;
    c.setAttribute("fill", frag ? fragColor(all.fragility[i]) : roundColor(r >= 0 && r <= shown ? r : -1));
  });
  document.querySelectorAll("#links line").forEach((l) => {
    const [i, j] = net.links[+l.dataset.k];
    const rj = rounds ? rounds[j] : -1;
    const on = rj >= 0 && rj < shown;  // the borrower has failed: the lender takes a loss on this loan
    l.setAttribute("stroke", on ? roundColor(Math.min(rj + 1, 4)) : "var(--link)");
    const kills = on && rounds[i] > rj && rounds[i] <= shown;  // this loss is part of why the lender failed
    l.setAttribute("stroke-width", kills ? 1.8 : on ? 0.8 : 0.6);
    l.setAttribute("opacity", kills ? 0.95 : on ? 0.4 : rounds ? 0.2 : 0.55);
  });
  document.querySelectorAll("#strip rect.bar").forEach((b) =>
    b.setAttribute("fill", +b.dataset.i === trigger && !frag ? "var(--trigger)" : "var(--accent)"));
  legend();
}

function tiles() {
  const spread = all.sizes.filter((s) => s > 0).length;
  $("t-share").innerHTML = spread + "&nbsp;%";
  const none = trigger === null || view === "frag";
  const size = none ? 2 : all.sizes[trigger], rounds = none ? 2 : Math.max(...all.rounds[trigger]);
  $("t-size").textContent = none ? "–" : size;
  $("t-rounds").textContent = none ? "–" : rounds;
  $("t-size-label").textContent = t("tileSize", size);
  $("t-rounds-label").textContent = t("tileRounds", rounds);
}

function strip() {
  const svg = $("strip"); svg.replaceChildren();
  const W = svg.clientWidth || 360, H = 110, top = 8, bottom = 18;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const order = [...all.sizes.keys()].sort((a, b) => all.sizes[b] - all.sizes[a]);
  const worst = Math.max(...all.sizes), max = Math.max(1, worst), bw = W / net.n;
  svg.append(svgEl("line", { x1: 0, x2: W, y1: H - bottom, y2: H - bottom, stroke: "var(--line)" }));
  order.forEach((i, k) => {
    const h = (H - top - bottom) * all.sizes[i] / max;
    const hit = svgEl("rect", { x: k * bw, y: 0, width: bw, height: H - bottom, fill: "transparent", class: "hit", style: "cursor:pointer" });
    const bar = svgEl("rect", { class: "bar", "data-i": i, x: k * bw + 0.5, y: H - bottom - Math.max(h, all.sizes[i] ? 2 : 0),
      width: Math.max(bw - 1, 1), height: Math.max(h, all.sizes[i] ? 2 : 0), rx: 1, fill: "var(--accent)" });
    for (const e of [hit, bar]) {
      e.addEventListener("click", () => fail(i));
      e.addEventListener("mousemove", (ev) => showTip(ev, `<b>${t("bank", i + 1)}</b><br>${t("stripTip", all.sizes[i])}`));
      e.addEventListener("mouseleave", hideTip);
    }
    svg.append(hit, bar);
  });
  const label = (attrs, text) => { const e = svgEl("text", { "font-size": 11, fill: "var(--muted)", ...attrs }); e.textContent = text; svg.append(e); };
  label({ x: 0, y: H - 4 }, t("stripMost"));
  label({ x: W, y: H - 4, "text-anchor": "end" }, t("stripLeast"));
  label({ x: W, y: top + 10, "text-anchor": "end", fill: "var(--ink2)" }, t("stripWorst", worst));
  const mean = all.sizes.reduce((a, b) => a + b, 0) / net.n;
  $("strip-note").textContent = t("stripNote", num(mean, 1), worst, mean >= 2);
}

function tables() {
  const top = (arr, f) => [...arr.keys()].sort((a, b) => arr[b] - arr[a]).slice(0, 10)
    .map((i) => `<tr><td>${t("bank", i + 1)}</td><td>${f(arr[i])}</td></tr>`).join("");
  $("tables").innerHTML =
    `<table><tr><th>${t("tabDamaging")}</th><th>${t("tabDamagingCol")}</th></tr>${top(all.sizes, (v) => v)}</table>` +
    `<table><tr><th>${t("tabFragile")}</th><th>${t("tabFragileCol")}</th></tr>${top(all.fragility, (v) => pct(num(100 * v, 0)))}</table>`;
}

function texts() {
  const tau = tauNow(), worst = Math.max(...all.sizes);
  $("cap-label").innerHTML = t("capLabel", `<span class="tau-value">${pct($("cap").value)}</span>`);
  $("lgd-label").innerHTML = t("lgdLabel", `<span class="tau-value">${pct($("lgd").value)}</span>`);
  $("shock-label").innerHTML = t("shockLabel", `<span class="tau-value">${pct($("shock").value)}</span>`);
  const where = tau > 1.15 ? t("whereStrong") : tau >= 0.84 ? t("whereReal") : tau >= 0.6 ? t("whereWeak") : t("whereStress");
  $("formula").innerHTML = (tau >= 1 ? t("formulaSafe") : t("formulaFail", `<b>${pct(num(100 * tau, 0))}</b>`)) +
    " " + t("formulaTau", `<b>${num(tau, 2)}</b>`) + " " + where;
  $("reading").textContent = worst === 0 ? t("readNone") : worst < 10 ? t("readFew") : worst < 50 ? t("readSome") : t("readFragile");
}

function animate() {
  clearInterval(timer);
  if (trigger === null) return;
  if (view !== "cascade") setView("cascade");
  const last = Math.max(...all.rounds[trigger]);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { shown = 99; paint(); return; }
  shown = 0; paint();
  timer = setInterval(() => { shown += 1; paint(); if (shown > last) clearInterval(timer); }, 650);
}

function setView(v) {
  view = v;
  $("v-cascade").setAttribute("aria-pressed", v === "cascade");
  $("v-frag").setAttribute("aria-pressed", v === "frag");
  clearInterval(timer); shown = 99; tiles(); paint();
}

function fail(i) { trigger = i; tiles(); animate(); }

function recompute(keepTrigger) {
  capital = capitalOf(net, prep, tauNow());
  all = allCascades(net, prep, capital);
  if (!keepTrigger) trigger = null;
  shown = 99; clearInterval(timer);
  texts(); tiles(); strip(); tables(); paint();
}

function load() {
  net = NETWORKS[+$("which").value]; prep = prepare(net);
  buildNetwork(); recompute(false);
}

// Legend dots are drawn as SVG circles, like the banks, so that they always show the same colour as the banks.
const dot = (color) => `<svg width="12" height="12" viewBox="0 0 12 12" style="vertical-align:-1px;margin-right:5px" aria-hidden="true"><circle cx="6" cy="6" r="5.5" fill="${color}"/></svg>`;
function legend() {
  const item = (color, text) => `<span>${dot(color)}${text}</span>`;
  $("legend").innerHTML = view === "frag"
    ? item("var(--bank)", t("legNever")) + [1, 2, 3, 4].map((r) => item(`var(--r${r})`, t("legBins")[r - 1])).join("") + `<span>${t("legFragNote")}</span>`
    : item("var(--bank)", t("legSurvives")) + item("var(--trigger)", t("legFirst")) +
      [1, 2, 3].map((r) => item(`var(--r${r})`, t("legRound", r))).join("") + item("var(--r4)", t("legLate")) + `<span>${t("legNote")}</span>`;
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.title = t("title");
  $("l-en").setAttribute("aria-pressed", l === "en");
  $("l-fr").setAttribute("aria-pressed", l === "fr");
  document.querySelectorAll("[data-t]").forEach((e) => { e.innerHTML = t(e.dataset.t); });
  $("net").setAttribute("aria-label", t("netLabel"));
  $("strip").setAttribute("aria-label", t("stripTitle"));
  networkNames();
  if (all) { texts(); tiles(); strip(); tables(); paint(); document.querySelectorAll("#banks circle").forEach((c) => c.setAttribute("aria-label", t("bank", +c.dataset.i + 1))); }
}

$("which").addEventListener("change", load);
for (const id of ["cap", "lgd", "shock"]) $(id).addEventListener("input", () => recompute(true));
$("v-cascade").addEventListener("click", () => setView("cascade"));
$("v-frag").addEventListener("click", () => setView("frag"));
$("worst").addEventListener("click", () => fail(worstBank()));
$("replay").addEventListener("click", animate);
$("l-en").addEventListener("click", () => setLang("en"));
$("l-fr").addEventListener("click", () => setLang("fr"));
window.addEventListener("resize", () => { strip(); paint(); });
setLang(lang);
load();
fail(worstBank());
</script>
</body>
</html>
